# Сборка сайта (Jupyter Book) и публикация на GitHub Pages при каждом пуше в main.
# Один раз включите: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Установка Jupyter Book
        run: pip install "jupyter-book<2" sphinxcontrib-mermaid
      - name: Ссылки на материалы → файлы в репозитории
        run: |
          owner="${GITHUB_REPOSITORY%/*}"; name="${GITHUB_REPOSITORY#*/}"
          site="$(echo "$owner" | tr '[:upper:]' '[:lower:]').github.io/${name}"
          sed -i -e "s#USER\.github\.io/REPO#${site}#g" -e "s#USER/REPO#${GITHUB_REPOSITORY}#g" README.md cheatsheet.ipynb
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/materials/"
          find . -path ./materials -prune -o \( -name "*.md" -o -name "*.ipynb" \) -print | while read -r f; do
            sed -i -e "s#](\(\.\./\.\./\)\?materials/#](${base}#g" "$f"
          done
      - name: Сборка
        run: jupyter-book build . --keep-going
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
