# Настройки сайта (Jupyter Book 1.x). Сборка: jupyter-book build .
title: "Машинное обучение: шпаргалка-курс"
author: ""
copyright: ""
logo: ""
only_build_toc_files: true

execute:
  execute_notebooks: "off"          # выводы уже сохранены в ноутбуке

parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - html_image
    - html_admonition
    - colon_fence

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    language: ru
    html_show_copyright: false
    html_show_sphinx: false
    myst_fence_as_directive: ["mermaid"]
    myst_heading_anchors: 6
    suppress_warnings: ["myst.header", "myst.xref_missing", "misc.highlighting_failure"]
    html_theme_options:
      use_download_button: true
      use_repository_button: false
      show_toc_level: 2

html:
  use_search_button: true
  home_page_in_navbar: true

repository:
  branch: main
